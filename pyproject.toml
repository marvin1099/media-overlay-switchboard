[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-overlay-switchboard"
version = "0.1.1"
description = "A media output switcher for streaming overlays"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
mo-switchboard-cli = "media_overlay_switchboard.cli:main"
mo-switchboard-gui = "media_overlay_switchboard.gui_launcher:main"

[tool.setuptools.packages.find]
include = ["media_overlay_switchboard*"]

[tool.setuptools.package-data]
media_overlay_switchboard = ["resources/*"]
